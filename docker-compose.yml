services:
  # PostgreSQL (FREE, self-hosted)
  postgres:
    image: postgres:16
    container_name: crypto_platform_db
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crypto_platform
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crypto_user -d crypto_platform']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (FREE, self-hosted)
  redis:
    image: redis:7-alpine
    container_name: crypto_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus (FREE monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: crypto_platform_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Grafana (FREE dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: crypto_platform_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
